<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📤 GitHub Uploader — Soulful Spirit</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0d1117; color: #e6edf3;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .card {
    background: #161b22; border: 1px solid #30363d;
    border-radius: 12px; padding: 32px; width: 480px; max-width: 95vw;
  }
  h1 { font-size: 20px; margin-bottom: 6px; }
  .sub { color: #8b949e; font-size: 14px; margin-bottom: 28px; }
  label { display: block; font-size: 13px; color: #8b949e; margin-bottom: 6px; }
  input[type="text"], input[type="password"] {
    width: 100%; background: #0d1117; border: 1px solid #30363d;
    border-radius: 6px; padding: 10px 12px; font-size: 14px; color: #e6edf3;
    outline: none; margin-bottom: 16px;
    transition: border-color 0.2s;
  }
  input[type="text"]:focus, input[type="password"]:focus {
    border-color: #388bfd;
  }
  .drop-zone {
    border: 2px dashed #30363d; border-radius: 8px;
    padding: 32px 16px; text-align: center; cursor: pointer;
    transition: all 0.2s; margin-bottom: 16px; position: relative;
  }
  .drop-zone:hover, .drop-zone.over { border-color: #388bfd; background: #1c2128; }
  .drop-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .drop-icon { font-size: 32px; margin-bottom: 8px; }
  .drop-text { font-size: 14px; color: #8b949e; }
  .file-selected { color: #3fb950; font-size: 13px; margin-bottom: 12px; }
  .btn {
    width: 100%; padding: 12px; border-radius: 6px;
    font-size: 15px; font-weight: 600; border: none; cursor: pointer;
    transition: opacity 0.2s; background: #238636; color: #fff;
  }
  .btn:hover { opacity: 0.85; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .log {
    margin-top: 20px; background: #0d1117; border: 1px solid #30363d;
    border-radius: 6px; padding: 12px; font-family: monospace;
    font-size: 12px; max-height: 220px; overflow-y: auto; display: none;
  }
  .log p { margin-bottom: 4px; }
  .ok { color: #3fb950; } .err { color: #f85149; } .info { color: #8b949e; }
  .progress {
    width: 100%; background: #30363d; border-radius: 4px;
    height: 6px; margin-top: 12px; display: none;
  }
  .progress-bar { height: 100%; background: #388bfd; border-radius: 4px; transition: width 0.3s; width: 0%; }
  .note { background: #1c2128; border: 1px solid #30363d; border-radius: 6px; padding: 12px; margin-bottom: 20px; font-size: 13px; color: #8b949e; }
  .note strong { color: #e6edf3; }
</style>
</head>
<body>
<div class="card">
  <h1>📤 Upload to GitHub Pages</h1>
  <p class="sub">อัพโหลด index.html เข้า Soulful Spirit repo</p>

  <div class="note">
    <strong>วิธีใช้:</strong><br>
    1. เปิดแอป Soulful Spirit ในเบราว์เซอร์<br>
    2. กด <strong>Export HTML</strong> → ได้ไฟล์ index.html<br>
    3. เลือกไฟล์นั้นด้านล่าง แล้วกด Upload
  </div>

  <label>GitHub Personal Access Token (repo scope)</label>
  <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" />

  <label>Repository (owner/repo)</label>
  <input type="text" id="repo" value="yingwarinya/soulfulspiritjewelrydesign" />

  <label>Branch</label>
  <input type="text" id="branch" value="main" />

  <label>File path in repo</label>
  <input type="text" id="filepath" value="index.html" />

  <label>เลือกไฟล์ที่ Export มา</label>
  <div class="drop-zone" id="dropZone">
    <input type="file" id="fileInput" accept=".html" />
    <div class="drop-icon">📁</div>
    <div class="drop-text">คลิกหรือลากไฟล์ index.html มาวางที่นี่</div>
  </div>
  <div class="file-selected" id="fileInfo" style="display:none"></div>

  <button class="btn" id="uploadBtn" onclick="uploadFile()" disabled>🚀 Upload to GitHub</button>
  <div class="progress" id="progress"><div class="progress-bar" id="progressBar"></div></div>
  <div class="log" id="log"></div>
</div>

<script>
let selectedFile = null;

const fileInput = document.getElementById('fileInput');
const dropZone = document.getElementById('dropZone');
const fileInfo = document.getElementById('fileInfo');
const uploadBtn = document.getElementById('uploadBtn');
const log = document.getElementById('log');
const progress = document.getElementById('progress');
const progressBar = document.getElementById('progressBar');

fileInput.addEventListener('change', e => setFile(e.target.files[0]));
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('over'); setFile(e.dataTransfer.files[0]); });

function setFile(f) {
  if (!f) return;
  selectedFile = f;
  const mb = (f.size / 1024 / 1024).toFixed(1);
  fileInfo.style.display = 'block';
  fileInfo.textContent = `✅ ${f.name} (${mb} MB)`;
  uploadBtn.disabled = false;
}

function addLog(msg, type='info') {
  log.style.display = 'block';
  const p = document.createElement('p');
  p.className = type;
  p.textContent = msg;
  log.appendChild(p);
  log.scrollTop = log.scrollHeight;
}

function setProgress(pct) {
  progress.style.display = 'block';
  progressBar.style.width = pct + '%';
}

async function uploadFile() {
  const token = document.getElementById('token').value.trim();
  const repo = document.getElementById('repo').value.trim();
  const branch = document.getElementById('branch').value.trim();
  const filepath = document.getElementById('filepath').value.trim();

  if (!token) { alert('กรุณากรอก GitHub Token'); return; }
  if (!selectedFile) { alert('กรุณาเลือกไฟล์'); return; }

  uploadBtn.disabled = true;
  log.innerHTML = '';
  addLog(`📂 กำลังอ่านไฟล์ ${selectedFile.name} (${(selectedFile.size/1024/1024).toFixed(1)} MB)...`);
  setProgress(10);

  // Read file as base64
  const base64 = await new Promise((res, rej) => {
    const reader = new FileReader();
    reader.onload = e => res(e.target.result.split(',')[1]);
    reader.onerror = rej;
    reader.readAsDataURL(selectedFile);
  });

  addLog('✅ อ่านไฟล์สำเร็จ, กำลัง encode...');
  setProgress(30);

  // Get current SHA of the file (needed for update)
  addLog(`🔍 ดึง SHA ปัจจุบันของ ${filepath}...`);
  const metaResp = await fetch(`https://api.github.com/repos/${repo}/contents/${filepath}?ref=${branch}`, {
    headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
  });

  let sha = null;
  if (metaResp.ok) {
    const meta = await metaResp.json();
    sha = meta.sha;
    addLog(`✅ SHA ปัจจุบัน: ${sha ? sha.slice(0,8) + '...' : 'ไม่พบ (จะสร้างไฟล์ใหม่)'}`, 'ok');
  } else if (metaResp.status === 404) {
    addLog('ℹ️ ไฟล์ยังไม่มีใน repo — จะสร้างใหม่', 'info');
  } else {
    // For large files GitHub returns empty content, get SHA from response headers or try git API
    addLog(`⚠️ ไฟล์ใหญ่เกิน — ใช้ Git Blobs API แทน`, 'info');
    // Try getting SHA from a different endpoint
    const refsResp = await fetch(`https://api.github.com/repos/${repo}/git/ref/heads/${branch}`, {
      headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
    });
    if (!refsResp.ok) { addLog('❌ ไม่สามารถดึง branch ref ได้', 'err'); uploadBtn.disabled = false; return; }
    const refData = await refsResp.json();
    const commitSha = refData.object.sha;
    addLog(`📌 commit SHA: ${commitSha.slice(0,8)}...`);
    await uploadViaGitAPI(token, repo, branch, filepath, base64, commitSha);
    return;
  }

  setProgress(50);
  addLog('📤 กำลัง upload ไปยัง GitHub...');

  // Upload via Contents API
  const body = { message: `Update ${filepath} via uploader tool`, content: base64, branch };
  if (sha) body.sha = sha;

  const uploadResp = await fetch(`https://api.github.com/repos/${repo}/contents/${filepath}`, {
    method: 'PUT',
    headers: {
      'Authorization': `token ${token}`,
      'Content-Type': 'application/json',
      'Accept': 'application/vnd.github.v3+json'
    },
    body: JSON.stringify(body)
  });

  setProgress(90);
  const uploadData = await uploadResp.json();

  if (uploadResp.ok) {
    addLog(`✅ Upload สำเร็จ! SHA: ${uploadData.content?.sha?.slice(0,8)}...`, 'ok');
    addLog(`🌐 GitHub Pages จะอัพเดทใน 1-2 นาที`, 'ok');
    setProgress(100);
    uploadBtn.textContent = '✅ อัพโหลดสำเร็จ!';
  } else {
    // File too large for Contents API → use Git API
    if (uploadResp.status === 422 || uploadResp.status === 413) {
      addLog('⚠️ ไฟล์ใหญ่เกิน Contents API — ใช้ Git Blobs API...', 'info');
      const refsResp = await fetch(`https://api.github.com/repos/${repo}/git/ref/heads/${branch}`, {
        headers: { 'Authorization': `token ${token}` }
      });
      const refData = await refsResp.json();
      await uploadViaGitAPI(token, repo, branch, filepath, base64, refData.object.sha);
    } else {
      addLog(`❌ Upload ล้มเหลว: ${uploadResp.status} — ${JSON.stringify(uploadData).slice(0,200)}`, 'err');
      uploadBtn.disabled = false;
    }
  }
}

async function uploadViaGitAPI(token, repo, branch, filepath, base64content, branchCommitSha) {
  const headers = {
    'Authorization': `token ${token}`,
    'Content-Type': 'application/json',
    'Accept': 'application/vnd.github.v3+json'
  };

  addLog('🔧 ใช้ Git Data API (รองรับไฟล์ใหญ่)...');
  setProgress(50);

  // Step 1: Create blob
  addLog('1/4 สร้าง blob...');
  const blobResp = await fetch(`https://api.github.com/repos/${repo}/git/blobs`, {
    method: 'POST', headers,
    body: JSON.stringify({ content: base64content, encoding: 'base64' })
  });
  if (!blobResp.ok) {
    const e = await blobResp.json();
    addLog(`❌ Blob ล้มเหลว: ${JSON.stringify(e).slice(0,200)}`, 'err');
    uploadBtn.disabled = false; return;
  }
  const blob = await blobResp.json();
  addLog(`✅ Blob: ${blob.sha.slice(0,8)}...`, 'ok');
  setProgress(60);

  // Step 2: Get current commit tree
  addLog('2/4 ดึง commit tree...');
  const commitResp = await fetch(`https://api.github.com/repos/${repo}/git/commits/${branchCommitSha}`, { headers });
  const commit = await commitResp.json();
  const treeSha = commit.tree.sha;
  addLog(`✅ Tree: ${treeSha.slice(0,8)}...`, 'ok');
  setProgress(70);

  // Step 3: Create new tree
  addLog('3/4 สร้าง tree ใหม่...');
  const treeResp = await fetch(`https://api.github.com/repos/${repo}/git/trees`, {
    method: 'POST', headers,
    body: JSON.stringify({
      base_tree: treeSha,
      tree: [{ path: filepath, mode: '100644', type: 'blob', sha: blob.sha }]
    })
  });
  const newTree = await treeResp.json();
  addLog(`✅ New tree: ${newTree.sha.slice(0,8)}...`, 'ok');
  setProgress(80);

  // Step 4: Create commit
  addLog('4/4 สร้าง commit...');
  const newCommitResp = await fetch(`https://api.github.com/repos/${repo}/git/commits`, {
    method: 'POST', headers,
    body: JSON.stringify({
      message: `Update ${filepath}: full export with all stones, charms & images`,
      tree: newTree.sha,
      parents: [branchCommitSha]
    })
  });
  const newCommit = await newCommitResp.json();
  addLog(`✅ Commit: ${newCommit.sha.slice(0,8)}...`, 'ok');
  setProgress(90);

  // Step 5: Update branch ref
  const refResp = await fetch(`https://api.github.com/repos/${repo}/git/refs/heads/${branch}`, {
    method: 'PATCH', headers,
    body: JSON.stringify({ sha: newCommit.sha })
  });
  if (refResp.ok) {
    addLog(`🎉 Upload สำเร็จ! GitHub Pages จะอัพเดทใน 1-2 นาที`, 'ok');
    setProgress(100);
    uploadBtn.textContent = '✅ อัพโหลดสำเร็จ!';
  } else {
    const e = await refResp.json();
    addLog(`❌ Update ref ล้มเหลว: ${JSON.stringify(e).slice(0,200)}`, 'err');
    uploadBtn.disabled = false;
  }
}
</script>
</body>
</html>
